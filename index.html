<style>
/* Layout: one-column phone app, sticky top bar, grouped list, bottom sheets for detail and forms */
:root {
  --bg: #eef1f0;
  --surface: #ffffff;
  --ink: #17211f;
  --muted: #5c6b68;
  --line: #d6dddb;
  --accent: #0f6b5c;
  --accent-ink: #ffffff;
  --accent-soft: #dcefea;
  --danger: #b3261e;
  --warn: #8a5a00;
  --warn-soft: #fbefd5;
  --shade: rgba(10, 20, 18, .45);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1413; --surface: #18211f; --ink: #e7eeec; --muted: #9aaba7; --line: #2b3835;
    --accent: #4fc2a9; --accent-ink: #06201a; --accent-soft: #173a33; --danger: #ff8a80;
    --warn: #f3c46b; --warn-soft: #3a2f17; --shade: rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1413; --surface: #18211f; --ink: #e7eeec; --muted: #9aaba7; --line: #2b3835;
  --accent: #4fc2a9; --accent-ink: #06201a; --accent-soft: #173a33; --danger: #ff8a80;
  --warn: #f3c46b; --warn-soft: #3a2f17; --shade: rgba(0, 0, 0, .6); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); margin: 0; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 96px; }

/* Lock / setup screens */
.gate { min-height: 100%; display: flex; align-items: center; justify-content: center; padding-block: 32px; }
.gate-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; }
.lockmark { width: 64px; height: 64px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.gate h1 { font-size: 28px; line-height: 1.15; margin: 4px 0 0; text-wrap: balance; letter-spacing: -.01em; }
.gate p { margin: 0; color: var(--muted); }
.note { font-size: 14px; background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; }
.err { color: var(--danger); font-size: 14px; min-height: 1.2em; }

label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); font-weight: 600; }
.in { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 17px; color: var(--ink); }
.in:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.in { min-height: 76px; resize: vertical; }
.row { display: flex; gap: 8px; align-items: center; }
.row > .in { flex: 1; min-width: 0; }

.btn { border: 0; border-radius: 12px; padding: 13px 16px; font-weight: 600; font-size: 16px; background: var(--accent-soft); color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.btn.ghost { background: transparent; color: var(--accent); padding: 8px 10px; }
.btn.sm { padding: 8px 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .5; }
.linkbtn { background: none; border: 0; color: var(--accent); padding: 4px 0; font-weight: 600; text-align: left; }

/* Top bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; display: flex; flex-direction: column; gap: 10px; }

.search { position: relative; }
.search input { padding-left: 40px; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.demo-banner { font-size: 13px; background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; }

.group-h { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0; padding: 4px 2px 8px; color: var(--muted); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }

.list { background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); overflow: hidden; }
.item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; padding: 12px 14px; border-top: 1px solid var(--line); }

.item:active { background: var(--accent-soft); }
.av { flex: none; position: relative; overflow: hidden; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-weight: 700; font-size: 16px; color: #fff; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; padding: 6px; }

.item .txt { min-width: 0; flex: 1; }
.item .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .l { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { text-align: center; color: var(--muted); padding: 48px 12px; display: flex; flex-direction: column; gap: 12px; align-items: center; }

.fab { position: fixed; right: max(20px, calc(env(safe-area-inset-right, 0px) + 20px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); z-index: 6; width: 60px; height: 60px; border-radius: 20px; border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 24px rgba(0,0,0,.22); display: grid; place-items: center; }

/* Sheets */
.shade { position: fixed; inset: 0; background: var(--shade); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; background: var(--bg); border-radius: 20px 20px 0 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px calc(env(safe-area-inset-bottom, 0px) + 20px); display: flex; flex-direction: column; gap: 14px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 2px; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-h h2 { margin: 0; font-size: 20px; min-width: 0; overflow-wrap: anywhere; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.field { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
.field:first-child { border-top: 0; }
.field .k { font-size: 13px; color: var(--muted); }
.field .v { overflow-wrap: anywhere; }
.field .v.mono { font-family: var(--mono); font-size: 16px; }
.field > div { flex: 1; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.warnline { font-size: 14px; background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1; }
.menu { display: flex; flex-direction: column; }
.menu button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 14px; }
.menu button:first-child { border-top: 0; }
.menu small { color: var(--muted); font-size: 13px; }
.menu .danger-t { color: var(--danger); font-weight: 600; }

.who { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px 4px 4px; font-weight: 600; font-size: 15px; color: var(--ink); max-width: 100%; min-width: 0; }
.who .dot, .pf .dot { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; }
.who span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pf { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-align: center; }
.pf .dot { width: 56px; height: 56px; font-size: 24px; }
.pf strong { overflow-wrap: anywhere; }
.pf small { color: var(--muted); }
.pf.add { border-style: dashed; color: var(--accent); background: transparent; justify-content: center; }
.prow { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
.prow:first-child { border-top: 0; }
.prow .in { flex: 1; min-width: 0; padding: 8px 10px; font-size: 16px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 15px; z-index: 40; max-width: calc(100% - 32px); text-align: center; }
.privacy { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(() => {

// ---------- Réglages ----------
const STORE_KEY = "moncoffre.v1";

const CLIP_CLEAR_MS = 45000;

// ---------- Catégories automatiques ----------
const CATS = [
  { id: "banque", name: "Banque & finances", color: "#2f6fb0", kw: ["banque","bank","credit agricole","creditagricole","credit mutuel","creditmutuel","cic","lcl","bnp","societe generale","societegenerale","sg.fr","caisse d'epargne","caisse-epargne","banquepopulaire","banque populaire","labanquepostale","banque postale","boursorama","boursobank","fortuneo","hellobank","ing","monabanq","revolut","n26","paypal","lydia","sumeria","qonto","shine","bforbank","axa banque","amex","american express","visa","mastercard","livret","assurance vie","bourse","crypto","binance","coinbase","yomoni","linxea"] },
  { id: "admin", name: "Impôts & administration", color: "#6b4fb0", kw: ["impots","impot","gouv.fr","gouv","service-public","franceconnect","ants","urssaf","caf","pole-emploi","pole emploi","francetravail","france travail","info-retraite","retraite","agirc","arrco","lassuranceretraite","net-entreprises","infogreffe","inpi","guichet-entreprises","formalites","cadastre","mairie","prefecture","la poste","laposte","ameli identite","msa","cesu","pajemploi"] },
  { id: "immo", name: "Immobilier & SCI", color: "#0f6b5c", kw: ["sci","immo","immobilier","seloger","logic-immo","bienici","pap.fr","pap","leboncoin immo","foncia","nexity","citya","orpi","century21","laforet","guy hoquet","syndic","copro","coproprietaire","gerance","gestion locative","locataire","bail","loyer","quittance","notaire","notaires","visale","garantme","locservice","edl","etat des lieux","ics","gercop","crypto immo","immofacile","rentila","bailfacile","smartloc","lodgis","diagnostic","patrimoine","dossierfacile","geoportail","cadastre","taxe fonciere","sci familiale"] },
  { id: "assur", name: "Assurances & santé", color: "#b0524f", kw: ["assurance","assur","axa","maif","macif","matmut","maaf","mma","gmf","allianz","generali","groupama","aviva","abeille","mutuelle","harmonie","mgen","malakoff","ag2r","alan","swisslife","april","ameli","cpam","doctolib","maiia","pharmacie","sante","hopital","laboratoire","cerballiance","biogroup","qare","livi"] },
  { id: "maison", name: "Énergie, internet & téléphone", color: "#b07d1f", kw: ["edf","engie","totalenergies","total energies","ekwateur","octopus","grdf","enedis","veolia","suez","saur","eau","orange","sosh","sfr","red by sfr","bouygues","bbox","free","freebox","free mobile","la poste mobile","b&you","box","fibre","energie","gaz","electricite"] },
  { id: "courses", name: "Courses & achats", color: "#c05621", kw: ["amazon","leclerc","carrefour","auchan","intermarche","lidl","aldi","casino","monoprix","franprix","super u","courses u","coursesu","drive","picard","fnac","darty","boulanger","cdiscount","leboncoin","vinted","ikea","leroy merlin","leroymerlin","castorama","bricodepot","decathlon","zalando","shein","ebay","aliexpress","temu","veepee","showroomprive","sephora","nocibe","vente","boutique","shop","store"] },
  { id: "mail", name: "Mails & réseaux sociaux", color: "#3d7a8a", kw: ["gmail","google","outlook","hotmail","live.fr","microsoft","office","yahoo","proton","protonmail","icloud","apple","orange mail","laposte.net","facebook","instagram","whatsapp","messenger","linkedin","twitter","x.com","tiktok","snapchat","pinterest","youtube","telegram","signal","threads","bluesky","mail","messagerie","dropbox","onedrive","drive"] },
  { id: "loisirs", name: "Loisirs, voyages & abonnements", color: "#8a3d7a", kw: ["netflix","spotify","deezer","disney","canal","canal+","mycanal","prime video","primevideo","molotov","apple tv","dazn","bein","sncf","sncf-connect","ouigo","air france","airfrance","easyjet","ryanair","transavia","booking","airbnb","abritel","expedia","trainline","blablacar","uber","bolt","club med","pierre et vacances","fnac spectacles","ticketmaster","cinema","pathe","ugc","journal","le monde","figaro","ouest-france","abonnement","kindle","audible","audible.fr","playstation","xbox","nintendo","steam"] },
];
const OTHER = { id: "autre", name: "Autres", color: "#6b7774" };
// Catégories créées par l'utilisatrice (enregistrées dans le coffre chiffré)
const CCOLORS = ["#5f7a4e", "#a0522d", "#4a6fa5", "#9c4f86", "#2e8b8b", "#b8860b", "#7b6cb0", "#c0504d"];
const customCats = () => (S && S.data && S.data.cats) || [];
const allCats = () => [...CATS, ...customCats(), OTHER];
const catById = id => allCats().find(c => c.id === id) || OTHER;
const splitKw = t => (t || "").split(/[,;\n]/).map(x => x.trim()).filter(x => x.length >= 2);

function norm(s) { return (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function hostOf(url) { try { return new URL(/^https?:\/\//i.test(url) ? url : "https://" + url).hostname.replace(/^www\./, ""); } catch { return ""; } }
function guessCat(e) {
  const hay = " " + norm(e.name) + " " + norm(hostOf(e.url)) + " " + norm(e.url) + " " + norm(e.notes) + " ";
  let best = null, bestScore = 0;
  for (const c of [...customCats(), ...CATS]) {
    let score = 0;
    for (const k of (c.kw || [])) {
      const kk = norm(k);
      // mots courts : il faut un mot entier ; mots longs : sous-chaîne
      const hit = kk.length <= 4 ? new RegExp("(^|[^a-z0-9])" + kk.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "([^a-z0-9]|$)").test(hay) : hay.includes(kk);
      if (hit) score += kk.length * (c.custom ? 2 : 1);
    }
    if (score > bestScore) { bestScore = score; best = c; }
  }
  if (!(best && best.custom) && /(^|[^a-z0-9])sci([^a-z0-9]|$)/.test(norm(e.name))) return "immo";
  return best ? best.id : OTHER.id;
}
const catOf = e => e.cat || guessCat(e);

// ---------- Chiffrement ----------
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function seal(key, salt, iter, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify(obj)));
  return { app: "moncoffre", v: 1, kdf: "PBKDF2-SHA256", iter, salt: b64(salt), iv: b64(iv), ct: b64(ct) };
}
async function openBlob(blob, pw) {
  const salt = unb64(blob.salt);
  const key = await deriveKey(pw, salt, blob.iter);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(blob.iv) }, key, unb64(blob.ct));
  return { key, salt, iter: blob.iter, data: JSON.parse(dec.decode(pt)) };
}

// ---------- Stockage local ----------
function readStore() { try { const s = localStorage.getItem(STORE_KEY); return s ? JSON.parse(s) : null; } catch { return null; } }
function writeStore(blob) { localStorage.setItem(STORE_KEY, JSON.stringify(blob)); }
function readSettings() { try { return Object.assign({ idleMin: 3, closed: [], icons: true }, JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}")); } catch { return { idleMin: 3, closed: [], icons: true }; } }
function writeSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {} }

// ---------- État ----------
let S = null;          // { key, salt, iter, data:{entries:[]}, demo:bool } quand déverrouillé
let settings = readSettings();
let query = "";
let curPid = null;     // profil affiché
const PCOLORS = ["#2f6fb0", "#b0524f", "#8a3d7a", "#b07d1f", "#3d7a8a", "#0f6b5c"];
const newId = () => crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
// Profils : un seul code pour tout le coffre, un profil par personne.
// Les anciens coffres (sans profils) sont rangés dans un premier profil « Moi ».
function ensureProfiles(data) {
  if (!Array.isArray(data.entries)) data.entries = [];
  if (!Array.isArray(data.cats)) data.cats = [];
  if (!Array.isArray(data.profiles) || !data.profiles.length) data.profiles = [{ id: newId(), name: "Moi", color: PCOLORS[0] }];
  const first = data.profiles[0].id, ids = new Set(data.profiles.map(p => p.id));
  for (const e of data.entries) if (!e.pid || !ids.has(e.pid)) e.pid = first;
  return data;
}
const profile = () => S.data.profiles.find(p => p.id === curPid) || S.data.profiles[0];
const pDot = p => `<span class="dot" style="background:${p.color}" aria-hidden="true">${h((p.name || "?").trim().charAt(0).toUpperCase() || "?")}</span>`;
let fails = 0, waitUntil = 0;
let idleTimer = null, hiddenAt = 0, clipTimer = null;

const $root = document.getElementById("root");
const h = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ICON = {

  </form></div>`;

  document.getElementById("unlockForm").onsubmit = async ev => {
    ev.preventDefault();
    const err = document.getElementById("err"), btn = document.getElementById("unlockBtn");
    const now = Date.now();
    if (now < waitUntil) return err.textContent = `Trop d'essais. Patientez ${Math.ceil((waitUntil - now) / 1000)} s.`;
    btn.disabled = true; btn.textContent = "Ouverture…";
    try {
      const r = await openBlob(readStore(), input.value);
      S = { ...r, demo: false }; fails = 0; startSession();
    } catch {
      fails++; if (fails >= 3) waitUntil = Date.now() + Math.min(300, 2 ** (fails - 2) * 5) * 1000;
      btn.disabled = false; btn.textContent = "Ouvrir"; input.value = "";
      err.textContent = fails >= 3 ? `Mot de passe incorrect. Patientez ${Math.ceil((waitUntil - Date.now()) / 1000)} s avant de réessayer.` : "Mot de passe incorrect.";
    }
  };
}

function genPassword(len = 18) {
  const sets = ["ABCDEFGHJKLMNPQRSTUVWXYZ", "abcdefghijkmnopqrstuvwxyz", "23456789", "!#$%&*+-=?@_"];
  const all = sets.join(""); const rnd = n => { const a = new Uint32Array(1); let x; do { crypto.getRandomValues(a); x = a[0]; } while (x >= Math.floor(2 ** 32 / n) * n); return x % n; };
  const out = sets.map(s => s[rnd(s.length)]);
  while (out.length < len) out.push(all[rnd(all.length)]);
  for (let i = out.length - 1; i > 0; i--) { const j = rnd(i + 1); [out[i], out[j]] = [out[j], out[i]]; }
  return out.join("");
}

async function exportBackup() {
  if (S.demo) return toast("Pas de sauvegarde en mode démo.");
  const blob = await seal(S.key, S.salt, S.iter, S.data);
  const d = new Date(), stamp = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const name = `Herbier-${stamp}.json`;
  const file = new File([JSON.stringify({ ...blob, exportedAt: d.toISOString() })], name, { type: "application/json" });
  return offerFile(file);
}
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
async function offerFile(file) {
  const name = file.name;
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      toast("Choisissez « Enregistrer dans Fichiers » si ce n'est pas fait.");
      return;
    }
  } catch (err) { if (err && err.name === "AbortError") return; }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Sauvegarde créée : " + name);
  } catch { toast("Cet écran ne permet pas d'enregistrer de fichier."); }
}

function pickBackup(fromSetup) {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    let blob; try { blob = JSON.parse(await f.text()); if (blob.app !== "moncoffre" || !blob.ct) throw 0; } catch { return toast("Ce fichier n'est pas une sauvegarde de l'app."); }
    openSheet(`<div class="sheet-h"><h2>Restaurer</h2><button class="btn ghost" id="rC">Annuler</button></div>
      <form id="rf" class="gate-card" style="max-width:none" autocomplete="off">
        <p style="margin:0;color:var(--muted)">${h(f.name)}. Entrez le code de ce fichier : votre code de l'époque, ou le code de partage qu'on vous a donné.</p>
        <label class="f" for="rPw">Code du fichier<input class="in" id="rPw" type="password" required></label>
        <div class="err" id="rErr" role="alert"></div>
        ${fromSetup || !S || S.demo ? "" : `<label class="f" for="rMode">Que faire ?<select class="in" id="rMode"><option value="merge">Ajouter aux identifiants actuels</option><option value="replace">Remplacer tout le coffre actuel</option></select></label>`}
        <button class="btn primary" type="submit" id="rGo">Restaurer</button>
      </form>`, sh => {
      const $ = s => sh.querySelector(s);
      $("#rC").onclick = closeSheet;
      $("#rf").onsubmit = async ev => {
        ev.preventDefault(); $("#rGo").disabled = true; $("#rGo").textContent = "Ouverture…";
        let r; try { r = await openBlob(blob, $("#rPw").value); } catch { $("#rGo").disabled = false; $("#rGo").textContent = "Restaurer"; return $("#rErr").textContent = "Mot de passe incorrect pour cette sauvegarde."; }
        const hadProfiles = Array.isArray(r.data.profiles) && r.data.profiles.length > 0;
        ensureProfiles(r.data);
        const incoming = r.data.entries;
        if (fromSetup || !S || S.demo) {
          // nouveau coffre : il garde le mot de passe de la sauvegarde
          S = { key: r.key, salt: r.salt, iter: r.iter, data: r.data, demo: false };
        } else if ($("#rMode").value === "replace") {
          S.data = r.data;
        } else {
          if (!hadProfiles) incoming.forEach(e => e.pid = profile().id); // ancienne sauvegarde : dans le profil affiché
          const map = new Map(S.data.entries.map(e => [e.id, e]));
          for (const e of incoming) { const cur = map.get(e.id); if (!cur || (e.updated || 0) > (cur.updated || 0)) map.set(e.id, e); }
          S.data.entries = [...map.values()];
          const known = new Set(S.data.profiles.map(p => p.id));
          if (hadProfiles) for (const p of r.data.profiles) if (!known.has(p.id)) S.data.profiles.push(p);
          const knownC = new Set(S.data.cats.map(c => c.id));
          for (const c of r.data.cats) if (!knownC.has(c.id)) S.data.cats.push(c);
        }
        try { await save(); } catch { return $("#rErr").textContent = "Enregistrement impossible sur cet appareil."; }
        closeSheet(); startSession();
        toast(r.data.shared && (fromSetup || !S || S.demo) ? "Profil ajouté. Le code de partage est devenu votre code : changez-le dans Réglages." : incoming.length + " identifiant(s) restauré(s)");
      };
    });
  };
  inp.click();
}

// ---------- Démarrage ----------
if (!window.crypto || !crypto.subtle) {
  $root.innerHTML = '<div class="wrap gate"><div class="gate-card"><h1>Herbier</h1><p>Cette page doit être ouverte en https pour pouvoir chiffrer vos données.</p></div></div>';
} else {
  lock();
}
if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude|claudeusercontent/.test(location.hostname)) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
